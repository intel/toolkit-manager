---
# Runs once, in preflight: sets headlamp_installs for this role's BYO skip and for
# gateway_landing_path. BYO in apiserver mode needs API server trust first.
- name: "headlamp | resolve | Whether Headlamp installs"
  ansible.builtin.set_fact:
    headlamp_installs: >-
      {{ (components | selectattr('name', 'eq', 'headlamp') | map(attribute='enabled') | first) | bool
         and (existing_kubernetes | default('', true) | length == 0
              or headlamp_byo_apiserver_trusted | bool
              or headlamp_auth_mode != 'apiserver') }}
