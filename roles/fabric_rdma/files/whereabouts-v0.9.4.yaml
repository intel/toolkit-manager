# Vendored from k8snetworkplumbingwg/whereabouts v0.9.4 (doc/crds/*.yaml, Apache-2.0):
# the IPAM that gives pods their addresses on the RDMA networks, unique across the
# rack (IPPool objects). Differences from upstream:
#   - in the rdma-network namespace (created with Multus; upstream uses kube-system)
#   - the image is pinned by digest (the role overrides it from rack_scale_rdma_whereabouts_image)
# The role also sets the tolerations and the rdma-nics node affinity. On each node it
# writes /etc/cni/net.d/whereabouts.d/ and /opt/cni/bin/whereabouts; teardown removes them.
# Bumping: replace this file and rack_scale_rdma_whereabouts_version/_digest in defaults/main.yaml.
