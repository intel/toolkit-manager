# =============================================================================
# fabric_rdma — Read back the RDMA NICs (install and validate)
# =============================================================================

- name: "fabric_rdma | Read back"
  ansible.builtin.include_tasks: probe.yaml

- name: "fabric_rdma | RoCE settings"
  ansible.builtin.set_fact:
    _rdma_settings:
      dscp: "{{ rack_scale_rdma_dscp | int }}"
      priority: "{{ rack_scale_rdma_priority | int }}"
      pfc: "{{ rack_scale_rdma_pfc | bool }}"
      ecn: "{{ rack_scale_rdma_ecn | bool }}"

- name: "fabric_rdma | Expected RDMA NICs"
  ansible.builtin.set_fact:
    _rdma_expected: >-
      {% set out = {} %}{% for h in _rdma_hosts %}{% set _ = out.update({h: {
        'nics': hostvars[h].node_rdma_nics, 'mgmt_ip': hostvars[h].ansible_host | default('')}}) %}{% endfor %}{{ out }}

- name: "fabric_rdma | Evaluate the read-back"
  ansible.builtin.set_fact:
    _rdma_eval: "{{ _rdma_readback | rdma_readback_evaluate(_rdma_expected, _rdma_settings) }}"
