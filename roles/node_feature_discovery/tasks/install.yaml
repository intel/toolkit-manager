# =============================================================================
# Node Feature Discovery — Install via Helm, or check the cluster's operator
# =============================================================================
# The cluster's one NFD. A release already there, also the one the inference
# layer's nfd role installed (same name, namespace and values), is upgraded in place.
# With _node_feature_discovery_from_olm (OpenShift) the Node Feature Discovery
# Operator produces the same feature.node.kubernetes.io/* labels, so install
# only checks it. Its worker would also need a privileged SCC.
# =============================================================================

- name: "node_feature_discovery | Check the cluster's operator"
  when: _node_feature_discovery_from_olm | bool
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "node_feature_discovery | Look up NodeFeatureDiscovery instances"
      kubernetes.core.k8s_info:
        api_version: nfd.openshift.io/v1
        kind: NodeFeatureDiscovery
      register: _nfd_olm_instances
      failed_when: false

    - name: "node_feature_discovery | Require the NFD operator"
      ansible.builtin.assert:
        that: _nfd_olm_instances.resources | default([]) | length > 0
        fail_msg: |-
          No NodeFeatureDiscovery instance found. Install the Node Feature Discovery
          operator (package nfd, namespace openshift-nfd) from OperatorHub and create a
          NodeFeatureDiscovery (docs/deployment/openshift.md, step 8), or set nfd_enabled: false
          if no model needs AMX node affinity (require_amx).
        success_msg: >-
          NFD provided by the cluster (OLM, {{ _nfd_olm_instances.resources | map(attribute='metadata.namespace') | join(', ') }})
          — skipping Helm install.

- name: "node_feature_discovery | Helm release"
  when: not _node_feature_discovery_from_olm | bool
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    # The NFD worker mounts host paths (/sys, /boot, /lib, /usr/lib, ...),
    # so its namespace needs the privileged Pod Security level. Labelled
    # before the install so the worker pods are admitted.
    - name: "node_feature_discovery | Label namespace — PSS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ node_feature_discovery_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "privileged"
              pod-security.kubernetes.io/audit: "privileged"
              pod-security.kubernetes.io/warn: "privileged"
      when: enforce_pss | default(false) | bool

    # Same values as the inference layer's nfd role, so the labels the
    # inference layer relies on (cpu-cpuid.AMXBF16, ...) are unchanged.
    - name: "node_feature_discovery | Install or upgrade via Helm"
      kubernetes.core.helm:
        name: node-feature-discovery
        chart_ref: "{{ node_feature_discovery_chart }}"
        chart_version: "{{ node_feature_discovery_version }}"
        release_namespace: "{{ node_feature_discovery_namespace }}"
        create_namespace: true
        wait: true
        timeout: "5m0s"
        values:
          master:
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
          worker:
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
      register: _nfd_install
      until: _nfd_install is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    # The GPU operator schedules its operands from the PCI labels the workers
    # publish, so they must be running on every node before it is installed.
    - name: "node_feature_discovery | Wait for worker DaemonSet ready"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: node-feature-discovery-worker
        namespace: "{{ node_feature_discovery_namespace }}"
      register: _nfd_ds
      until:
        - _nfd_ds.resources | default([]) | length > 0
        - (_nfd_ds.resources[0].status.numberReady | default(0)) == (_nfd_ds.resources[0].status.desiredNumberScheduled | default(0))
      retries: 30
      delay: 10

# The model catalog's require_amx schedules models only on these nodes.
- name: "node_feature_discovery | Find AMX nodes"
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "feature.node.kubernetes.io/cpu-cpuid.AMXBF16=true"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  register: _nfd_amx_nodes

- name: "node_feature_discovery | AMX node summary"
  ansible.builtin.debug:
    msg: >-
      NFD detected {{ _nfd_amx_nodes.resources | length }} node(s) with AMX support:
      {{ _nfd_amx_nodes.resources | map(attribute='metadata.name') | join(', ') or 'none' }}

- name: "node_feature_discovery | ━━━ DONE ━━━"
  ansible.builtin.debug:
    msg: >-
      {{ 'NFD operator' if _node_feature_discovery_from_olm | bool
         else 'NFD ' ~ node_feature_discovery_version ~ ' running in ' ~ node_feature_discovery_namespace }}
      — the cluster's one NFD.
