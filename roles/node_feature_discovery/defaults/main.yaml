# =============================================================================
# Node Feature Discovery Role Defaults
# =============================================================================
# The cluster's one NFD, installed before the GPU operator so the operator does
# not bring its own copy. On OpenShift the Node Feature Discovery Operator is
# checked instead (vars/openshift.yaml). The release name (node-feature-discovery),
# namespace and values match the inference layer's former nfd role, which
# preflight leaves out of the plan, so the labels the inference layer relies on
# (cpu-cpuid.AMXBF16, ...) are unchanged. Its nfd_namespace, nfd_helm_chart and
# nfd_version overrides apply here too.
# =============================================================================

node_feature_discovery_namespace: "{{ nfd_namespace | default('node-feature-discovery') }}"
# 0.20 and later are published only as this OCI chart: the Helm repo stops at 0.19.
node_feature_discovery_chart: "{{ nfd_helm_chart | default('oci://registry.k8s.io/nfd/charts/node-feature-discovery') }}"
node_feature_discovery_version: "{{ nfd_version | default('0.20.1') }}"
