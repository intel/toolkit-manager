---
# Red Hat build of Keycloak, installed by the admin from OperatorHub (OLM).
_keycloak_operator_deployment: rhbk-operator
# No PSS labels: OpenShift syncs them from the SCCs, and the keycloak namespace is the admin's.
_keycloak_pss_labels: false
# The operator is the admin's (OLM): the role only creates the instance.
_keycloak_from_olm: true
# Out-of-mesh callers the STRICT mesh must let in, port by port: Authorino (Red Hat
# Connectivity Link) reads the inference realm's keys, the user-workload Prometheus
# scrapes the management port. `probed`: the kubelet's probes call the port too.
_keycloak_out_of_mesh_callers:
  - {port: 8080, namespace_labels: {kubernetes.io/metadata.name: "{{ keycloak_authorino_namespace }}"}}
  - {port: 9000, namespace_labels: {network.openshift.io/policy-group: monitoring}, probed: true}
# Istio's fixed source address for the kubelet's probes: istio-cni SNATs them to it
# on the node, so they reach the pod from this address, not the node's.
_keycloak_probe_address: 169.254.7.127/32
