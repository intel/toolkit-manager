---
# Red Hat build of Keycloak, installed by the admin from OperatorHub (OLM).
_keycloak_operator_deployment: rhbk-operator
# No PSS labels: OpenShift syncs them from the SCCs, and the keycloak namespace is the admin's.
_keycloak_pss_labels: false
# The operator is the admin's (OLM): the role only creates the instance.
_keycloak_from_olm: true
# Ports the STRICT mesh lets out-of-mesh callers reach in plain TCP: Authorino (Red Hat
# Connectivity Link) reads the inference realm's keys on 8080, the user-workload
# Prometheus scrapes the management port 9000.
_keycloak_out_of_mesh_exceptions:
  - name: keycloak
    selector: {app: keycloak, app.kubernetes.io/managed-by: keycloak-operator}
    ports: [8080, 9000]
