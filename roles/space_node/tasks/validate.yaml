# =============================================================================
# SPACE node — Validate
# =============================================================================

- name: "space_node | validate | Get the space RuntimeClass"
  kubernetes.core.k8s_info:
    api_version: node.k8s.io/v1
    kind: RuntimeClass
    name: space
  register: _val_space_rc

- name: "space_node | validate | Get SPACE worker nodes"
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "{{ space_node_label_key }}={{ space_node_label_value }}"
  register: _val_space_nodes

- name: "space_node | validate | Check SPACE nodes are prepared"
  ansible.builtin.assert:
    that:
      - _val_space_rc.resources | length > 0
      - _val_space_nodes.resources | length > 0
    fail_msg: >-
      space_enabled is set but {{ 'RuntimeClass space is missing'
      if _val_space_rc.resources | length == 0 else 'no node is labelled '
      ~ space_node_label_key ~ '=' ~ space_node_label_value }}. Run install
      space_node: it stops with the per-node results when a prerequisite is missing.
    success_msg: >-
      SPACE nodes: {{ _val_space_nodes.resources | map(attribute='metadata.name') | join(', ') }}
