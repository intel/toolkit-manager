# =============================================================================
# SPACE node — Teardown
# Removes the cluster objects and labels. Host files (/space, the node layer
# units, the containerd block) stay, as for Kata; docs/space.md lists the cleanup.
# =============================================================================

- name: "space_node | teardown | Remove the space RuntimeClass and PriorityClasses"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
  loop:
    - {api_version: node.k8s.io/v1, kind: RuntimeClass, name: space}
    - {api_version: scheduling.k8s.io/v1, kind: PriorityClass, name: space-control-plane}
    - {api_version: scheduling.k8s.io/v1, kind: PriorityClass, name: space-replaceable}
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false

- name: "space_node | teardown | Get nodes"
  kubernetes.core.k8s_info:
    kind: Node
  register: _space_teardown_nodes
  failed_when: false

- name: "space_node | teardown | Remove SPACE node labels"
  kubernetes.core.k8s:
    state: patched
    kind: Node
    name: "{{ item.metadata.name }}"
    definition:
      metadata:
        labels: "{{ {space_node_label_key: none, space_node_pool_label_key: none, space_infra_label_key: none} }}"
  loop: "{{ _space_teardown_nodes.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false

- name: "space_node | teardown | Complete"
  ansible.builtin.debug:
    msg: "SPACE RuntimeClass, PriorityClasses and node labels removed"
