---
_observability_from_olm: true
# Workloads in observability_namespace that callers outside the mesh reach in plain TCP.
_observability_olm_out_of_mesh_exceptions:
  # Prometheus scrapes these.
  - name: logging-loki
    selector: {app.kubernetes.io/instance: logging-loki, app.kubernetes.io/managed-by: lokistack-controller}
    ports: [3100, 8081, 8083]
  # The Grafana Operator calls Grafana's API.
  - name: "{{ observability_openshift_grafana_name }}"
    selector: {app: "{{ observability_openshift_grafana_name }}"}
    ports: [3000]
  # Tempo exits on its first failed object-store call. Without CNI chaining
  # istio-cni captures a pod only through a running process, so a Tempo that has
  # not been captured yet is refused by S3 under STRICT and never stays up long
  # enough to be captured. Its plain TCP to S3 is let in; once captured it uses mTLS.
  - name: "{{ seaweedfs_release_name }}-seaweedfs-s3"
    selector: {app.kubernetes.io/instance: "{{ seaweedfs_release_name }}", app.kubernetes.io/name: seaweedfs, app.kubernetes.io/component: s3}
    ports: [8333]
