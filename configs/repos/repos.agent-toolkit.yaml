repos:
  - layer: "inference"
    url: "https://github.com/intel/inference-toolkit"
    dest: "enterprise.ai-inference"
    rev: "main"
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
    model_catalog: "model_manager/models.yaml"

  - layer: "agent-toolkit"
    url: "https://github.com/intel/agent-toolkit"
    dest: "enterprise.agent-toolkit"
    rev: "main"
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
