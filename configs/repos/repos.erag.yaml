---
# =============================================================================
# Layer manifest — erag
# =============================================================================
# The inference layer eRAG builds on, then eRAG itself, each pinned to the
# rev this layer is validated against. Dependencies first: inference is
# cloned and seeded before erag.
#
# Field reference: docs/reference/adding-solutions.md
# =============================================================================

repos:
  - layer: "inference"
    url: "https://github.com/intel/inference-toolkit"
    dest: "enterprise.ai-inference"
    rev: "8389f47f94403fd682dcd90e02ed5cc25e6eef18" # v1.2.0-rc.1
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
    model_catalog: "model_manager/models.yaml"

  - layer: "erag"
    url: "https://github.com/intel/chatbot-toolkit"
    dest: "enterprise.ai-erag"
    rev: "6fa81aa0a9852cbf195317d45bfe8648ebc7a955" # v3.1.0-rc.1
    deployment_subdir: "deployment"
    config_dir: "pipelines"
    default_flavour: "chatqna"
